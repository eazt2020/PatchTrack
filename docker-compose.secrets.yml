# Optional override: bootstrap secrets from files instead of .env.
#
#   sudo install -d -m 0750 -o root -g root /etc/patchtrack/secrets
#   # One file per value, mode 0640 root:root. Compose bind-mounts a file
#   # secret with this ownership and mode, and the image runs as UID 1001 /
#   # GID 0, so group root is what lets the containers read it. Only root can
#   # read the files on the host.
#   sudo install -m 0640 -o root -g root /dev/null \
#     /etc/patchtrack/secrets/database_url \
#     /etc/patchtrack/secrets/jwt_secret \
#     /etc/patchtrack/secrets/service_token \
#     /etc/patchtrack/secrets/postgres_password
#   # then fill them (database_url contains the complete SQLAlchemy URL, and
#   # its password must be the same value as postgres_password)
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# The plain variables of the same name in .env may remain during migration:
# the application gives the *_FILE value precedence. Once the stack is
# verified, delete them from .env so the credentials are no longer passed into
# every container as environment variables.
#
# PATCHTRACK_SECRETS_DIR can point at another host directory. Every file must
# exist or Compose refuses to start, which is deliberate: a missing secret must
# not silently fall back to a weaker value.

name: patchtrack

x-app-secret-environment: &app-secret-environment
  PATCHTRACK_DATABASE_URL_FILE: /run/secrets/database_url
  PATCHTRACK_JWT_SECRET_FILE: /run/secrets/jwt_secret
  PATCHTRACK_SERVICE_TOKEN_FILE: /run/secrets/service_token
  # Mask the environment fallbacks inherited from env_file: .env, so the
  # credentials are no longer present in the container's environment.
  PATCHTRACK_DATABASE_URL: ""
  PATCHTRACK_JWT_SECRET: ""
  PATCHTRACK_SERVICE_TOKEN: ""

x-app-secrets: &app-secrets
  - database_url
  - jwt_secret
  - service_token

secrets:
  database_url:
    file: ${PATCHTRACK_SECRETS_DIR:-/etc/patchtrack/secrets}/database_url
  jwt_secret:
    file: ${PATCHTRACK_SECRETS_DIR:-/etc/patchtrack/secrets}/jwt_secret
  service_token:
    file: ${PATCHTRACK_SECRETS_DIR:-/etc/patchtrack/secrets}/service_token
  postgres_password:
    file: ${PATCHTRACK_SECRETS_DIR:-/etc/patchtrack/secrets}/postgres_password

services:
  postgres:
    environment:
      # The official image honours POSTGRES_PASSWORD_FILE. Red Hat's image is
      # not documented to support the file form; if you use it, keep
      # POSTGRES_PASSWORD in .env instead (see docs/configuration.md).
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  migrate:
    environment: *app-secret-environment
    secrets: *app-secrets

  identity:
    environment: *app-secret-environment
    secrets: *app-secrets

  inventory:
    environment: *app-secret-environment
    secrets: *app-secrets

  compliance:
    environment: *app-secret-environment
    secrets: *app-secrets

  reporting:
    environment: *app-secret-environment
    secrets: *app-secrets

  # The worker reads the URL from the file itself, so it needs only the
  # database credential. Its base definition masks the other secrets.
  backup:
    environment:
      PATCHTRACK_DATABASE_URL: ""
      PATCHTRACK_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url

  gateway:
    environment: *app-secret-environment
    secrets: *app-secrets
