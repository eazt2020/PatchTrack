<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PatchTrack — Patch Compliance</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" type="image/png" href="/static/brand/favicon.png">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img class="brand-logo" src="/static/brand/logo.png" alt="">
      </div>
      <div class="brand-copy">
        <div class="brand-name">PatchTrack</div>
        <div class="brand-sub">Patch intelligence. Simplified</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <div class="sidebar-foot">
      <div class="version-chip">
        <span class="version-mark" aria-hidden="true">◆</span>
        <div>
          <div class="version-name" id="app-version">v3.0.7</div>
          <div class="version-sub">Open Source Edition</div>
        </div>
      </div>
      <div class="user-chip">
        <div class="avatar" id="user-initials">–</div>
        <div class="user-copy">
          <div class="user-name" id="user-name">–</div>
          <div class="user-role" id="user-role">–</div>
        </div>
        <button class="icon-btn" id="logout" type="button" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <!-- Hover strip at the very top of the screen; reveals the header in TV mode. -->
    <div class="topbar-hotzone" aria-hidden="true"></div>
    <header class="topbar">
      <button class="btn btn-sm nav-toggle" id="nav-toggle" type="button"
              aria-controls="sidebar" aria-expanded="false"
              aria-label="Open navigation">☰</button>
      <div class="page-heading">
        <h1 id="page-title">Executive Dashboard</h1>
        <p id="page-context" class="page-subtitle"></p>
      </div>
      <span class="spacer"></span>
      <div id="page-actions" class="page-actions"></div>
      <div class="topbar-tools">
        <span class="topbar-meta" id="last-refresh"></span>
        <button class="icon-btn" id="refresh" type="button" title="Refresh data" aria-label="Refresh data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
        <button class="icon-btn" id="kiosk-toggle" type="button" title="Hide the navigation for a wall display (K)" aria-pressed="false" aria-label="TV mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
