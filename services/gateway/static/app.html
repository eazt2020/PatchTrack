<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PatchTrack — Patch Compliance</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" type="image/png" href="/static/brand/favicon.png">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img class="brand-logo" src="/static/brand/logo.png" alt="">
      </div>
      <div>
        <div class="brand-name">PatchTrack</div>
        <div class="brand-sub">Patch compliance</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="user-initials">–</div>
        <div>
          <div class="user-name" id="user-name">–</div>
          <div class="user-role" id="user-role">–</div>
        </div>
      </div>
      <button class="btn btn-sm" id="logout" style="width:100%;justify-content:center">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <!-- Hover strip at the very top of the screen; reveals the header in TV mode. -->
    <div class="topbar-hotzone" aria-hidden="true"></div>
    <header class="topbar">
      <button class="btn btn-sm nav-toggle" id="nav-toggle" type="button"
              aria-controls="sidebar" aria-expanded="false"
              aria-label="Open navigation">☰</button>
      <h1 id="page-title">Executive dashboard</h1>
      <span id="page-context" class="topbar-meta"></span>
      <span class="spacer"></span>
      <span class="topbar-meta" id="last-refresh"></span>
      <button class="btn btn-sm" id="kiosk-toggle" title="Hide the navigation for a wall display (K)" aria-pressed="false">⛶ TV mode</button>
      <button class="btn btn-sm" id="refresh" title="Refresh data">Refresh</button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
