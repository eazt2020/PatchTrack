[pytest]
testpaths = tests
# Integration tests are discovered here too, but skip themselves when no
# PostgreSQL is reachable (see tests/integration/conftest.py), so a plain
# `pytest` run works in a build container and a developer host alike.
python_files = test_*.py
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:reportlab.*
    ignore::pytest.PytestDeprecationWarning
markers =
    slow: tests that take more than a few seconds
