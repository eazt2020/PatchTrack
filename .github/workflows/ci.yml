name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install linter
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check services scripts tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: patchtrack
          POSTGRES_PASSWORD: patchtrack
          POSTGRES_DB: patchtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PATCHTRACK_TEST_DATABASE_URL: postgresql+psycopg://patchtrack:patchtrack@127.0.0.1:5432/patchtrack_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/container/requirements*.txt
      - name: Install dependencies from the hashed lock
        run: |
          pip install --require-hashes -r deploy/container/requirements.lock.txt
          pip install -r deploy/container/requirements-dev.txt
      - name: Run the suite
        # Integration tests create their own database when PostgreSQL is
        # reachable; without it they skip, so this job catches both.
        run: pytest
