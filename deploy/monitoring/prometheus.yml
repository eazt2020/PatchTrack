# Prometheus scrape configuration for PatchTrack.
#
# Every backend service exposes /metrics on its internal port. The gateway is
# deliberately absent: its listener is published to operators, so it must not
# serve an unauthenticated metrics endpoint. The backends are reachable only on
# the service network, which is where the scraper runs.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: patchtrack
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity:8001
          - inventory:8002
          - compliance:8003
          - reporting:8004
        labels:
          environment: production

  # Uncomment to have Prometheus scrape itself.
  # - job_name: prometheus
  #   static_configs:
  #     - targets: ["localhost:9090"]
