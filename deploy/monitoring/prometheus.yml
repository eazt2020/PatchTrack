# Prometheus scrape configuration for PatchTrack.
#
# Every service exposes /metrics on its internal port. The gateway is not used
# as a proxy for metrics: a scraper has no user session, and the endpoint is
# deliberately reachable only on the service network / loopback.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: patchtrack
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity:8001
          - inventory:8002
          - compliance:8003
          - reporting:8004
          - gateway:8005
        labels:
          environment: production

  # Uncomment to have Prometheus scrape itself.
  # - job_name: prometheus
  #   static_configs:
  #     - targets: ["localhost:9090"]
